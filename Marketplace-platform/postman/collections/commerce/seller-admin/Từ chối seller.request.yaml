$kind: http-request
name: 'Từ chối seller'
method: PATCH
url: 'http://127.0.0.1:8001/admin/sellers/{{sellerId}}/reject'
order: 1776043672047
headers:
  - key: Content-Type
    value: application/json
auth:
  type: noauth
description: |-
  Từ chối seller PENDING → REJECTED kèm lý do.

  **Path param:** `id` — ID của shop/seller

  **Body fields:**
  - `reason` *(required)* — lý do từ chối (không được để trống)

  **Logic BE:**
  - Set status = REJECTED
  - is_active=0, user.isActive=0
  - Lưu rejection_reason vào DB

  **Error cases:**
  - 400 — reason is required (thiếu hoặc blank)
  - 404 — Seller not found
body:
  type: json
  content: |-
    {
      "reason": "Thông tin shop không đầy đủ, vui lòng bổ sung giấy phép kinh doanh."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ✅ TC-01: Status 200 OK
      pm.test("TC-01: Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      // ✅ TC-02: Response là object seller
      pm.test("TC-02: Response body is a seller object", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an("object").and.not.an("array");
      });

      // ✅ TC-03: status đã được set thành REJECTED
      pm.test("TC-03: Seller status is now REJECTED", function () {
          const json = pm.response.json();
          pm.expect(json.status).to.eql("REJECTED");
      });

      // ✅ TC-04: Có đủ fields bắt buộc
      pm.test("TC-04: Response has required fields", function () {
          const json = pm.response.json();
          ["id", "accountCode", "brandTitle", "email", "status", "ownerName"].forEach(field => {
              pm.expect(json).to.have.property(field);
          });
      });

      // ✅ TC-05: id khớp với sellerId đã reject
      pm.test("TC-05: Returned id matches requested sellerId", function () {
          const json = pm.response.json();
          const requestedId = String(pm.collectionVariables.get("sellerId"));
          pm.expect(String(json.id)).to.eql(requestedId);
      });

      // ✅ TC-06: Response time < 2000ms
      pm.test("TC-06: Response time is less than 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // ─── VALIDATE cases ───────────────────────────────────────────────────
      // ❌ VALIDATE-01: Thiếu reason → 400
      // Body: {} → expect 400 "reason is required"

      // ❌ VALIDATE-02: reason là chuỗi rỗng → 400
      // Body: { "reason": "" } → expect 400 "reason is required"

      // ❌ VALIDATE-03: reason chỉ có khoảng trắng → 400
      // Body: { "reason": "   " } → expect 400 "reason is required"

      // ❌ VALIDATE-04: ID không tồn tại → 404
      // URL: /admin/sellers/999999/reject → expect 404 "Seller not found"

      // ❌ VALIDATE-05: Reject seller đã REJECTED → 200 (idempotent)
      // Gọi lại lần 2 → expect 200, status vẫn REJECTED
