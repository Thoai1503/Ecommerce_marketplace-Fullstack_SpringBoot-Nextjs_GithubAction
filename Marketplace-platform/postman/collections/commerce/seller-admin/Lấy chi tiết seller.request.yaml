$kind: http-request
name: 'Lấy chi tiết seller'
method: GET
url: 'http://127.0.0.1:8001/admin/sellers/{{sellerId}}'
order: 1776043672042
headers:
  - key: Content-Type
    value: application/json
auth:
  type: noauth
description: |-
  Lấy chi tiết một seller theo ID.

  **Path param:** `id` — ID của shop/seller

  **Response fields:**
  - id, accountCode (SE-XXXX), brandTitle, category, website
  - location, email, phone, logoUrl, status (PENDING/ACTIVE/REJECTED/BLOCKED)
  - createdAt, ownerName, totalProducts, totalOrders, totalRevenue, rating, reviewCount

  **Error cases:**
  - 404 — Seller not found
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ✅ TC-01: Status 200 OK
      pm.test("TC-01: Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      // ✅ TC-02: Response là object (không phải array)
      pm.test("TC-02: Response body is an object", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an("object").and.not.an("array");
      });

      // ✅ TC-03: Có đủ các fields bắt buộc
      pm.test("TC-03: Response has all required fields", function () {
          const json = pm.response.json();
          ["id", "accountCode", "brandTitle", "status", "email", "ownerName",
           "totalProducts", "totalOrders", "totalRevenue", "rating", "reviewCount"]
              .forEach(field => pm.expect(json).to.have.property(field));
      });

      // ✅ TC-04: id khớp với sellerId đã request
      pm.test("TC-04: Returned id matches requested sellerId", function () {
          const json = pm.response.json();
          const requestedId = String(pm.collectionVariables.get("sellerId"));
          pm.expect(String(json.id)).to.eql(requestedId);
      });

      // ✅ TC-05: accountCode đúng format SE-XXXX
      pm.test("TC-05: accountCode follows SE-XXXX format", function () {
          const json = pm.response.json();
          pm.expect(json.accountCode).to.match(/^SE-\d{4}$/);
      });

      // ✅ TC-06: status là giá trị hợp lệ
      pm.test("TC-06: status is a valid value", function () {
          const json = pm.response.json();
          pm.expect(["PENDING", "ACTIVE", "REJECTED", "BLOCKED"]).to.include(json.status);
      });

      // ✅ TC-07: totalRevenue và rating là số
      pm.test("TC-07: Numeric fields are numbers", function () {
          const json = pm.response.json();
          pm.expect(json.totalRevenue).to.be.a("number");
          pm.expect(json.rating).to.be.a("number");
      });

      // ✅ TC-08: Response time < 2000ms
      pm.test("TC-08: Response time is less than 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // ─── VALIDATE cases ───────────────────────────────────────────────────
      // ❌ VALIDATE-01: ID không tồn tại → 404
      // URL: /admin/sellers/999999 → expect 404 "Seller not found"

      // ❌ VALIDATE-02: ID không phải số → 400
      // URL: /admin/sellers/abc → expect 400

      // ❌ VALIDATE-03: ID là số âm → 404
      // URL: /admin/sellers/-1 → expect 404
