
spring.application.name=marketplace-platform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
mysql.host=localhost
mysql.port=3306
mysql.database=ecommerce
mysql.username=root
mysql.password=123456



spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.data-source-properties.serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.hikari.data-source-properties.connectionTimeZone=Asia/Ho_Chi_Minh
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.kafka.bootstrap-servers=103.90.225.130:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.properties.linger.ms=1
spring.kafka.producer.buffer-memory=33554432

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Local default is localhost. On server, set FRONTEND_URL=http://103.90.225.130:4000
app.frontend-url=${FRONTEND_URL:http://103.90.225.130:4000}
app.api-url=${PUBLIC_API_URL:http://103.90.225.130:8000}

app.email-verification.secret=${EMAIL_VERIFICATION_SECRET:nexamart-local-email-secret}
app.jwt.secret=${JWT_SECRET:nexamart-local-jwt-secret-change-me}
app.jwt.buyer.access-token-seconds=${JWT_BUYER_ACCESS_TOKEN_SECONDS:1800}
app.jwt.seller.access-token-seconds=${JWT_SELLER_ACCESS_TOKEN_SECONDS:1800}
app.jwt.admin.access-token-seconds=${JWT_ADMIN_ACCESS_TOKEN_SECONDS:900}
app.jwt.buyer.refresh-token-seconds=${JWT_BUYER_REFRESH_TOKEN_SECONDS:604800}
app.jwt.seller.refresh-token-seconds=${JWT_SELLER_REFRESH_TOKEN_SECONDS:604800}
app.jwt.admin.refresh-token-seconds=${JWT_ADMIN_REFRESH_TOKEN_SECONDS:86400}
app.jwt.buyer.idle-timeout-seconds=${JWT_BUYER_IDLE_TIMEOUT_SECONDS:3600}
app.jwt.seller.idle-timeout-seconds=${JWT_SELLER_IDLE_TIMEOUT_SECONDS:3600}
app.jwt.admin.idle-timeout-seconds=${JWT_ADMIN_IDLE_TIMEOUT_SECONDS:1800}
order.service.url=${ORDER_SERVICE_URL:http://103.90.225.130:8002}


spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}

# Pool must be large enough for concurrent requests + async background threads.
# Each request to createRefundRequestWithFiles needs its own connection AND the async
# triggerAsyncFinalAmountUpdate fires after commit, so minimum 5 connections are required.
# Override at runtime with env var DB_POOL_SIZE
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:3}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:600000}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh


spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}

