stages:
  - build
  - deploy

variables:
  # Use GitLab Container Registry images
  SPRING_IMAGE: $CI_REGISTRY_IMAGE/spring-app:$CI_COMMIT_SHORT_SHA
  NEXTJS_IMAGE: $CI_REGISTRY_IMAGE/nextjs-app:$CI_COMMIT_SHORT_SHA
  SPRING_IMAGE_LATEST: $CI_REGISTRY_IMAGE/spring_app:latest
  NEXTJS_IMAGE_LATEST: $CI_REGISTRY_IMAGE/nextjs_app:latest
  # Docker-in-Docker settings
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  # Deployment settings
  DEPLOY_PATH: "/root/Thoai1503-project"
  VPS_IP: "103.90.225.130"

build-backend:
  stage: build
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      alias: docker
  before_script:
    - echo "Logging into GitLab Container Registry..."
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd Marketplace-platform

    - docker build -t $SPRING_IMAGE -t $SPRING_IMAGE_LATEST .
    - echo "Pushing Spring Boot images..."
    - docker push $SPRING_IMAGE
    - docker push $SPRING_IMAGE_LATEST
  tags:
    - full_final
  only:
    - main
    - develop

build-frontend:
  stage: build
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      alias: docker
  before_script:
    - echo "Logging into GitLab Container Registry..."
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - cd marketfrontend

    - docker build -t $NEXTJS_IMAGE -t $NEXTJS_IMAGE_LATEST .
    - echo "Pushing Next.js images..."
    - docker push $NEXTJS_IMAGE
    - docker push $NEXTJS_IMAGE_LATEST
  tags:
    - full_final
  only:
    - main
    - develop

# Optional: Test SSH connection manually
test-ssh:
  stage: deploy
  image: alpine:latest
  needs: []
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo "Host *" > ~/.ssh/config
    - echo "  StrictHostKeyChecking no" >> ~/.ssh/config
    - chmod 600 ~/.ssh/config
  script:
    - echo "Testing SSH connection to $VPS_IP..."
    - ssh -v root@$VPS_IP "echo 'SSH connection successful!' && whoami && pwd"
  tags:
    - full_final
  when: manual
  only:
    - main

deploy-to-vps:
  stage: deploy
  image: alpine:latest
  needs:
    - build-backend
    - build-frontend
  before_script:
    - apk add --no-cache openssh-client
    # Setup SSH
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    # Disable strict host key checking for automated deployment
    - echo "Host *" > ~/.ssh/config
    - echo "  StrictHostKeyChecking no" >> ~/.ssh/config
    - echo "  UserKnownHostsFile=/dev/null" >> ~/.ssh/config
    - chmod 600 ~/.ssh/config
    # Test connection
    - echo "Testing SSH connection..."
    - ssh -o ConnectTimeout=10 root@$VPS_IP "echo 'Connected to VPS successfully'"
  script:
    - echo "Starting deployment to VPS..."

    # Step 1: Update code from GitLab
    - echo "Updating code from GitLab..."
    - ssh root@$VPS_IP "if [ -d $DEPLOY_PATH ]; then rm -rf $DEPLOY_PATH; fi"
    - ssh root@$VPS_IP "git clone --depth 1 --branch main $CI_REPOSITORY_URL $DEPLOY_PATH"

    # Step 3: Login to GitLab Container Registry on VPS
    - echo "Logging into GitLab Container Registry on VPS..."
    - ssh root@$VPS_IP "echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY"

    # Step 4: Stop old containers first
    - echo "Stopping old containers..."
    - ssh root@$VPS_IP "cd $DEPLOY_PATH && docker-compose down || true"

    # Step 5: Remove old images to force pull new ones
    - echo "Removing old Docker images..."
    - ssh root@$VPS_IP "docker rmi $SPRING_IMAGE_LATEST || true"
    - ssh root@$VPS_IP "docker rmi $NEXTJS_IMAGE_LATEST || true"

    # Step 6: Set environment variables for docker-compose

    - ssh root@$VPS_IP "cd $DEPLOY_PATH && export IMAGE_TAG=$CI_COMMIT_SHORT_SHA && export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE && echo \"IMAGE_TAG=\$IMAGE_TAG\" > .env && echo \"CI_REGISTRY_IMAGE=\$CI_REGISTRY_IMAGE\" >> .env"

    # Step 7: Pull specific tagged images

    - ssh root@$VPS_IP "cd $DEPLOY_PATH && IMAGE_TAG=$CI_COMMIT_SHORT_SHA CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE docker-compose pull"

    # Step 8: Start containers with new images
    - echo "Starting containers with new images..."
    - ssh root@$VPS_IP "cd $DEPLOY_PATH && IMAGE_TAG=$CI_COMMIT_SHORT_SHA CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE docker-compose up -d --force-recreate --remove-orphans"

    # Step 8: Wait for containers to be healthy
    - echo "Waiting for containers to start..."
    - sleep 10

    # Step 9: Verify deployment
    - echo "Verifying deployment..."
    - ssh root@$VPS_IP "cd $DEPLOY_PATH && docker-compose ps"
    - ssh root@$VPS_IP "cd $DEPLOY_PATH && docker-compose logs --tail=20"

    # Step 10: Clean up old Docker images
    - echo "Cleaning up old Docker images..."
    - ssh root@$VPS_IP "docker image prune -af --filter 'until=24h'"

    - echo "✅ Deployment completed successfully!"

  after_script:
    # Show logs if deployment fails
    - echo "Container status:"
    - ssh root@$VPS_IP "docker ps -a" || true
    - echo "Recent logs:"
    - ssh root@$VPS_IP "cd $DEPLOY_PATH && docker-compose logs --tail=50" || true
  tags:
    - full_final
  only:
    - main
  when: on_success
  # Uncomment below to allow rollback
  # allow_failure: false
