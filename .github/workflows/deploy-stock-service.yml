name: Deploy stock-service

on:
  push:
    branches: ["main"]
    paths:
      - "stock-service/**"
      - "Marketplace-platform/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build Marketplace-platform (shared dependency classes)
        working-directory: Marketplace-platform
        run: |
          chmod +x mvnw
          ./mvnw -DskipTests install

      - name: Build stock-service JAR
        working-directory: stock-service
        run: |
          chmod +x mvnw
          ./mvnw -DskipTests package
          
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./stock-service
          push: true
          tags: |
            thoaimanhlong/stock-service:latest
            thoaimanhlong/stock-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy changed service to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd ${{ secrets.VPS_APP_DIR }}

            SERVICE="stock-service"
            echo "Deploy service: ${SERVICE}"

            if docker compose config --services | grep -x "${SERVICE}" >/dev/null 2>&1; then
              docker compose pull "${SERVICE}"
              docker compose stop "${SERVICE}" 2>/dev/null || true
              docker compose rm -f "${SERVICE}" 2>/dev/null || true
              docker rm -f "${SERVICE}" 2>/dev/null || true
              docker compose up -d "${SERVICE}"
              FAILED=$(docker compose ps "${SERVICE}" --status exited -q)
              if [ ! -z "${FAILED}" ]; then
                echo "Service exited: ${SERVICE}"
                docker compose ps "${SERVICE}"
                docker compose logs "${SERVICE}" --tail=200
                exit 1
              fi
            else
              echo "Service ${SERVICE} not found in compose; fallback to full deploy"
              docker compose pull
              docker compose up -d --remove-orphans
            fi

            docker image prune -f
