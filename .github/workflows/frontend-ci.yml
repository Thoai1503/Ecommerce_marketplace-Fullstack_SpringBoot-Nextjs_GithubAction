name: Frontend CI

on:
  push:
    branches: [develop, feature/*, Diep1]

    paths:
      - "marketfrontend/**"
  pull_request:
    paths:
      - "marketfrontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Next.js
        working-directory: marketfrontend
        run: |
          npm install
          npm run build
