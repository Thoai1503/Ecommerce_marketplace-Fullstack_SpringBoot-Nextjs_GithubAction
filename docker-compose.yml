version: "3.8"

services:
  backend:
    image: thoaimanhlong/ecommerce-backend:latest
    container_name: ecommerce-backend
    ports:
      - "8000:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped

  frontend:
    image: thoaimanhlong/ecommerce-frontend:latest
    container_name: ecommerce-frontend
    ports:
      - "4000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
