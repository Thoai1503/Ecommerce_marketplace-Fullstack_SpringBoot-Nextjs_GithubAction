<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shipment Status History API Tester</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        background: white;
        border-radius: 10px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 600px;
        width: 100%;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        text-align: center;
      }

      .subtitle {
        color: #666;
        text-align: center;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        color: #333;
        font-weight: 600;
        margin-bottom: 8px;
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 5px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102, 126, 234, 0.2);
      }

      textarea {
        resize: vertical;
        min-height: 80px;
      }

      .button-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 30px;
      }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }

      .btn-send {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-send:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .btn-clear {
        background: #f0f0f0;
        color: #333;
      }

      .btn-clear:hover {
        background: #e0e0e0;
      }

      .response-area {
        margin-top: 30px;
        padding: 20px;
        background: #f5f5f5;
        border-radius: 5px;
        border-left: 4px solid #667eea;
      }

      .response-title {
        color: #333;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .response-content {
        background: white;
        padding: 15px;
        border-radius: 5px;
        max-height: 300px;
        overflow-y: auto;
        font-family: "Courier New", monospace;
        font-size: 12px;
        color: #333;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .status-indicator {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 8px;
      }

      .status-indicator.success {
        background: #4caf50;
      }

      .status-indicator.error {
        background: #f44336;
      }

      .status-indicator.loading {
        background: #ff9800;
      }

      .info-box {
        background: #e3f2fd;
        border-left: 4px solid #2196f3;
        padding: 15px;
        border-radius: 5px;
        margin-bottom: 20px;
        color: #1565c0;
        font-size: 13px;
      }

      .info-box strong {
        display: block;
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚚 Shipment Status History</h1>
      <p class="subtitle">API Tester - No curl/PowerShell needed!</p>

      <div class="info-box">
        <strong>🎯 How to use:</strong>
        Fill in the form below and click "Send Request". No need to worry about
        JSON formatting!
      </div>

      <form id="apiForm">
        <div class="form-group">
          <label for="shipmentId">Shipment ID *</label>
          <input
            type="number"
            id="shipmentId"
            name="shipmentId"
            value="277"
            required
          />
        </div>

        <div class="form-group">
          <label for="status">Status *</label>
          <select id="status" name="status" required>
            <option value="">-- Select Status --</option>
            <option value="PENDING">PENDING - Chờ xác nhận</option>
            <option value="CONFIRMED">CONFIRMED - Đã xác nhận</option>
            <option value="PICKED_UP">PICKED_UP - Đã lấy hàng</option>
            <option value="IN_TRANSIT">IN_TRANSIT - Đang giao</option>
            <option value="OUT_FOR_DELIVERY">
              OUT_FOR_DELIVERY - Giao hôm nay
            </option>
            <option value="DELIVERED">DELIVERED - Đã giao</option>
            <option value="FAILED">FAILED - Giao thất bại</option>
            <option value="RETURNED">RETURNED - Hoàn lại</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Description *</label>
          <textarea id="description" name="description" required>
Package picked up from warehouse</textarea
          >
        </div>

        <div class="form-group">
          <label for="location">Location (Optional)</label>
          <input
            type="text"
            id="location"
            name="location"
            placeholder="e.g., Warehouse A, Kho Bình Thạnh"
          />
        </div>

        <div class="form-group">
          <label for="updatedBy">Updated By (Optional)</label>
          <input
            type="text"
            id="updatedBy"
            name="updatedBy"
            placeholder="e.g., webhook_partner, test_user"
          />
        </div>

        <div class="button-group">
          <button type="button" class="btn-send" onclick="sendRequest()">
            Send Request
          </button>
          <button type="reset" class="btn-clear">Clear Form</button>
        </div>
      </form>

      <div class="response-area" id="responseArea" style="display: none">
        <div class="response-title">
          <span class="status-indicator" id="statusIndicator"></span>
          Response
        </div>
        <div class="response-content" id="responseContent"></div>
      </div>
    </div>

    <script>
      const API_BASE = "http://localhost:8007/api/logistics";

      async function sendRequest() {
        const shipmentId = document.getElementById("shipmentId").value;
        const status = document.getElementById("status").value;
        const description = document.getElementById("description").value;
        const location = document.getElementById("location").value;
        const updatedBy = document.getElementById("updatedBy").value;

        // Validate required fields
        if (!shipmentId || !status || !description) {
          alert("Please fill in all required fields (*)");
          return;
        }

        const responseArea = document.getElementById("responseArea");
        const responseContent = document.getElementById("responseContent");
        const statusIndicator = document.getElementById("statusIndicator");

        // Show loading state
        responseArea.style.display = "block";
        statusIndicator.className = "status-indicator loading";
        responseContent.textContent = "Sending request...";

        // Build request body
        const body = {
          status: status,
          description: description,
        };

        if (location) {
          body.location = location;
        }

        if (updatedBy) {
          body.updatedBy = updatedBy;
        }

        try {
          const response = await fetch(
            `${API_BASE}/shipments/${shipmentId}/status-history`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(body),
            },
          );

          const responseText = await response.text();
          let formattedResponse;

          try {
            const jsonResponse = JSON.parse(responseText);
            formattedResponse = JSON.stringify(jsonResponse, null, 2);
          } catch {
            formattedResponse = responseText;
          }

          if (response.ok) {
            statusIndicator.className = "status-indicator success";
            responseContent.textContent = `✅ SUCCESS (${response.status})\n\n${formattedResponse}`;
          } else {
            statusIndicator.className = "status-indicator error";
            responseContent.textContent = `❌ ERROR (${response.status})\n\n${formattedResponse}`;
          }
        } catch (error) {
          statusIndicator.className = "status-indicator error";
          responseContent.textContent = `❌ Network Error:\n\n${error.message}\n\nMake sure the API server is running at ${API_BASE}`;
        }
      }

      // Allow Enter key to send
      document
        .getElementById("apiForm")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
            sendRequest();
          }
        });
    </script>
  </body>
</html>
