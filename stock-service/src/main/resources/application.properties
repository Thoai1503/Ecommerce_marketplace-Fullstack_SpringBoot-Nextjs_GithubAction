spring.application.name=stock-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}


spring.kafka.consumer.bootstrap-servers=103.90.225.130:29092
spring.kafka.consumer.group-id=stock-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=docker_test.com.dto.OrderItem
 
spring.kafka.topic.order.name=order_topics
spring.kafka.topic.stock-update.name=update_stock_topics

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

server.port= 8009