spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:18161}/${DB_NAME:payment_db}?sslMode=REQUIRED&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USER:avnadmin}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 15000
      validation-timeout: 10000
      #    initialization-fail-timeout: 60000
      keepalive-time: 120000
      max-lifetime: 600000
      idle-timeout: 30000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate # Use 'validate' in production, 'create-drop' for dev/test
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false # Set to true for debugging

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8082
  servlet:
    context-path: /payment-service

logging:
  level:
    root: INFO
    payment_service.com: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
