spring.application.name=api-gateway
spring.main.web-application-type=reactive
eureka.instance.hostname=localhost
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE

#Order Service Routes
spring.cloud.gateway.routes[0].id=order-service
#spring.cloud.gateway.routes[0].uri=lb://order-service
spring.cloud.gateway.routes[0].uri= http://localhost:8082
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/order/**

spring.cloud.gateway.routes[1].id=maketplace-platform
spring.cloud.gateway.routes[1].uri= http://localhost:8000
spring.cloud.gateway.routes[1].predicates[0]=Path=/**

spring.cloud.gateway.routes[2].id=cart-service
spring.cloud.gateway.routes[2].uri= http://localhost:8003
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/cart/**

server.port=8001